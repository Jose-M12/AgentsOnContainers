# ContainersAgents local defaults.
# This file is sourced by agentctl after ROOT_DIR has been defined.

# No-argument shell selection.
DEFAULT_DISTRO="debian"
DEFAULT_PROFILE="auto"

# The only project tree mounted into both persistent containers by default.
DEFAULT_PROJECT="$ROOT_DIR/projects/container-agent-test"

# Stop the container after the interactive shell exits, while preserving its
# writable layer, installed packages, shell history, and /home/node state.
AUTO_STOP_AFTER_SHELL="1"

# Both distributions share the same project mount. Stop the other distribution
# automatically before starting the selected one to avoid concurrent edits.
STOP_OTHER_DISTRO_ON_START="1"

# Resource ceilings. These are limits, not reservations.
BATTERY_CPUS="4"
BATTERY_MEMORY="10g"
BALANCED_CPUS="8"
BALANCED_MEMORY="16g"
AC_CPUS="12"
AC_MEMORY="22g"
SHM_SIZE="1g"
PIDS_LIMIT="4096"
